<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lore Hub</title>

<style>
:root {
    --bg: #0b0f14;
    --panel: #151c25;
    --text: #e6e6e6;
    --muted: #9aa4b2;
    --accent: #0e0091;
    --border: #263241;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* HERO */
.hero {
    height: 70vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background-size: cover;
    background-position: center;
}

.hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.9));
}

.hero-content {
    position: relative;
    max-width: 900px;
    padding: 2rem;
}

.hero-title {
    font-size: 3.2rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 1rem;
}

.hero-desc {
    color: var(--muted);
    font-size: 1.1rem;
}

/* NAV */
nav {
    position: sticky;
    top: 0;
    background: rgba(11,15,20,0.95);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
}

nav ul {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    list-style: none;
}

nav a {
    display: block;
    padding: 1rem 1.2rem;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
}

nav a:hover {
    background: var(--accent);
}

/* CONTENT */
main {
    max-width: 1100px;
    margin: auto;
    padding: 2rem;
}

.section-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 1.5rem;
    border-radius: 10px;
    margin-top: 2rem;
}
</style>
</head>

<body>

<!-- HERO -->
<header class="hero" id="hero">

    <div class="hero-overlay"></div>

    <div class="hero-content">
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-desc" id="heroDesc"></p>
    </div>
</header>

<!-- NAV -->
<nav id="nav">
    <ul>
        <li><a data-title="Overview"
               data-desc="A fragmented world shaped by prolonged conflict and collapsing alliances."
               data-bg="https://www.unitedhollowrepublic.com/images/maps/placeholderIMAGE.png">Overview</a></li>

        <li><a data-title="History"
               data-desc="Key events leading to the current conflicts."
               data-bg="https://www.unitedhollowrepublic.com/images/maps/placeholderIMAGE.png">History</a></li>

        <li><a data-title="Factions"
               data-desc="Nations, powers, and groups."
               data-bg="https://www.unitedhollowrepublic.com/images/maps/placeholderIMAGE.png">Factions</a></li>

        <li><a data-title="Locations"
               data-desc="Key landmarks and warzones."
               data-bg="https://www.unitedhollowrepublic.com/images/maps/placeholderIMAGE.png">Locations</a></li>

        <li><a data-title="Arsenal"
               data-desc="Vehicles, Weapons, & Systems."
               data-bg="https://www.unitedhollowrepublic.com/images/maps/placeholderIMAGE.png">Arsenal</a></li>

        <li><a data-title="Characters"
               data-desc="Operatives and important individuals"
               data-bg="https://www.unitedhollowrepublic.com/images/maps/placeholderIMAGE.png">Characters</a></li>

        <li><a data-title="Intel"
               data-desc="Review intel found during events"
               data-bg="https://www.unitedhollowrepublic.com/images/maps/placeholderIMAGE.png">Intel</a></li>
    </ul>
</nav>

<!-- CONTENT -->
<main>
    <div class="section-box">
        <h1>Welcome</h1>
        <p>Use the navigation buttons above to explore the lore.
          If you're here before the update, please be patient until everything is done! I will ping.
        </p>
    </div>

    <div class="section-box">
        <h2>CHANGELOG</h2>
        <p>Brand new page!</p>
    </div>
</main>

<script>
const hero = document.getElementById("hero");
const heroTitle = document.getElementById("heroTitle");
const heroDesc = document.getElementById("heroDesc");
const nav = document.getElementById("nav");

/* DEFAULT HERO STATE */
const defaultState = {
    title: "Lore Hub",
    desc: "Select a category below to view lore content.",
    bg: "https://www.unitedhollowrepublic.com/images/maps/MapBackgroundBlur.png"
};

/* SET HERO */
function setHero(state) {
    heroTitle.textContent = state.title;
    heroDesc.textContent = state.desc;
    hero.style.backgroundImage = `url(${state.bg})`;
}

/* NAV INTERACTIONS */
document.querySelectorAll("nav a").forEach(link => {
    link.addEventListener("mouseenter", () => {
        setHero({
            title: link.dataset.title,
            desc: link.dataset.desc,
            bg: link.dataset.bg
        });
    });

    link.addEventListener("click", () => {
        setHero({
            title: link.dataset.title,
            desc: link.dataset.desc,
            bg: link.dataset.bg
        });
    });
});

/* RESET WHEN NOT HOVERING NAV */
nav.addEventListener("mouseleave", () => {
    setHero(defaultState);
});

/* INIT DEFAULT */
setHero(defaultState);
</script>

</body>
</html>
